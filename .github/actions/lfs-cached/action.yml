name: Git LFS (cached)
description: Pull Git LFS objects through the Actions cache, so each run doesn't spend LFS bandwidth.
runs:
  using: composite
  steps:
    - name: List LFS objects
      shell: bash
      run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
    - uses: actions/cache@v4
      with:
        path: .git/lfs
        key: lfs-${{ hashFiles('.lfs-assets-id') }}
        restore-keys: lfs-
    - name: Pull LFS objects
      shell: bash
      run: git lfs pull
    - name: Remove the LFS listing (keeps the working tree clean for unity-builder)
      shell: bash
      run: rm -f .lfs-assets-id
