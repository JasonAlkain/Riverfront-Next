# EditMode tests (including the map validator) plus Windows client and dedicated server builds,
# on every pull request and every push to main. Uses GameCI (https://game.ci).
#
# Needs three repository secrets (Settings > Secrets and variables > Actions):
#   UNITY_LICENSE   contents of a Unity Personal .ulf file (see https://game.ci/docs/github/activation)
#   UNITY_EMAIL     the Unity account's email
#   UNITY_PASSWORD  the Unity account's password
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# unity-test-runner posts its results as a check run, which needs checks: write.
permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  test:
    name: EditMode tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Git LFS (cached)
        uses: ./.github/actions/lfs-cached
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-test-
      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        with:
          # Version comes from ProjectSettings/ProjectVersion.txt (6000.6.5f1).
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode test results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts

  build:
    name: Build Windows ${{ matrix.target }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [client, server]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Git LFS (cached)
        uses: ./.github/actions/lfs-cached
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-build-${{ matrix.target }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-build-${{ matrix.target }}-
      - name: Build
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: StandaloneWindows64
          # The project's own build entry point: same scenes, version stamping and symbol handling as a local build.
          buildMethod: Game.Conquest.Build.ReleaseBuild.BuildFromCommandLine
          customParameters: -buildTargets ${{ matrix.target }} -buildOutput build/ci -buildVersion ci-${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: rivetfront-windows-${{ matrix.target }}
          path: build/ci/windows-${{ matrix.target }}
          retention-days: 7
